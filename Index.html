<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver's Log</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; margin: 0; padding: 12px; background: #f2f4f7; }
  h1 { font-size: 1.3rem; text-align: center; margin: 8px 0 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 6px 4px; text-align: center; font-size: 0.95rem; }
  th { background: #1f4e79; color: #fff; }
  tr:nth-child(even) td { background: #f7f9fc; }
  input[type=time] { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 6px 2px; border: 1px solid #ccc; border-radius: 6px; }
  .dur { font-weight: bold; color: #1f4e79; white-space: nowrap; }
  .total { margin: 14px 0; padding: 14px; background: #1f4e79; color: #fff; text-align: center; font-size: 1.2rem; border-radius: 8px; }
  button { width: 100%; padding: 12px; font-size: 1rem; border: none; border-radius: 8px; background: #c0392b; color: #fff; }
</style>
</head>
<body>
<h1>Driver's Log</h1>
<table>
  <thead>
    <tr><th>#</th><th>Start</th><th>Finish</th><th>Duration</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="total">Total driving time: <span id="total">0h 00m</span></div>
<button onclick="clearAll()">Clear all</button>

<script>
const rows = document.getElementById('rows');
const saved = JSON.parse(localStorage.getItem('driverLog') || '[]');

for (let i = 0; i < 10; i++) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${i + 1}</td>
    <td><input type="time" id="s${i}"></td>
    <td><input type="time" id="f${i}"></td>
    <td class="dur" id="d${i}">-</td>`;
  rows.appendChild(tr);
  if (saved[i]) {
    document.getElementById('s' + i).value = saved[i].s || '';
    document.getElementById('f' + i).value = saved[i].f || '';
  }

}
